<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zri.info</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Roboto',sans-serif;
            background:linear-gradient(180deg,#0a0a0a 0%,#1a1a2e 100%);
            min-height:100vh;
            color:#fff;
            line-height:1.5;
            position:relative;
            overflow-x:hidden;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }
        .wave-container{
            position:fixed;bottom:0;left:0;width:100%;height:120px;overflow:hidden;z-index:-1;
        }
        .wave{
            position:absolute;bottom:0;width:200%;height:100%;
            background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(162, 89, 255, 0.8)" fill-opacity="1" d="M0,128C48,112,96,96,144,96C192,96,240,112,288,128C336,144,384,160,432,160C480,160,528,144,576,128C624,112,672,96,720,96C768,96,816,112,864,128C912,144,960,160,1008,160C1056,160,1104,144,1152,128C1200,112,1248,96,1296,96C1344,96,1392,112,1440,128L1440,320L0,320Z"></path></svg>') repeat-x;
            background-size:50% 100%;
            animation:waveMove 15s ease-in-out infinite,waveFloat 5s ease-in-out infinite;
            opacity:.8;
        }
        .wave:nth-child(2){
            animation:waveMove 18s ease-in-out infinite reverse,waveFloat 6s ease-in-out infinite;
            opacity:.6;
            background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(120, 50, 200, 0.7)" fill-opacity="1" d="M0,160C48,144,96,128,144,128C192,128,240,144,288,160C336,176,384,192,432,192C480,192,528,176,576,160C624,144,672,128,720,128C768,128,816,144,864,160C912,176,960,192,1008,192C1056,192,1104,176,1152,160C1200,144,1248,128,1296,128C1344,128,1392,144,1440,160L1440,320L0,320Z"></path></svg>') repeat-x;
        }
        .wave:nth-child(3){
            animation:waveMove 12s ease-in-out infinite,waveFloat 4s ease-in-out infinite;
            opacity:.4;
            background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(80, 30, 150, 0.6)" fill-opacity="1" d="M0,192C48,176,96,160,144,160C192,160,240,176,288,192C336,208,384,224,432,224C480,224,528,208,576,192C624,176,672,160,720,160C768,160,816,176,864,192C912,208,960,224,1008,224C1056,224,1104,208,1152,192C1200,176,1248,160,1296,160C1344,160,1392,176,1440,192L1440,320L0,320Z"></path></svg>') repeat-x;
        }
        @keyframes waveMove{0%{transform:translateX(0)}50%{transform:translateX(-25%)}100%{transform:translateX(0)}}
        @keyframes waveFloat{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}

        .stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
        .star{position:absolute;width:6px;height:6px;background:#a259ff;border-radius:50%;box-shadow:0 0 15px rgba(162,89,255,1),0 0 25px rgba(162,89,255,0.8);animation:shoot 4s linear infinite,twinkle 1.5s ease-in-out infinite}
        .star::before{content:'';position:absolute;width:40px;height:2px;background:linear-gradient(90deg,transparent,rgba(162,89,255,0.9));left:-40px;top:50%;transform:translateY(-50%)}
        @keyframes shoot{0%{transform:translateX(0) translateY(0);opacity:1}100%{transform:translateX(-130vw) translateY(90vh);opacity:.2}}
        @keyframes twinkle{0%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.5}100%{transform:scale(1);opacity:1}}

        .content-wrapper{
            max-width:700px;padding:50px;border-radius:20px;
            background:rgba(26,26,26,0.2);backdrop-filter:blur(10px);
            border:2px solid rgba(162,89,255,0.3);
            box-shadow:0 8px 32px rgba(0,0,0,0.4);
            animation:popIn 1s ease forwards,borderGlow 5s linear infinite,pulseGlow 3s ease-in-out infinite;
        }
        @keyframes popIn{0%{transform:scale(.95);opacity:0}100%{transform:scale(1);opacity:1}}
        @keyframes borderGlow{0%{border-color:rgba(162,89,255,0.3)}50%{border-color:rgba(255,119,255,0.5)}100%{border-color:rgba(162,89,255,0.3)}}
        @keyframes pulseGlow{0%{box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 15px rgba(162,89,255,0.3)}50%{box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 25px rgba(162,89,255,0.5)}100%{box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 15px rgba(162,89,255,0.3)}}

        h1{font-size:6em;color:#a259ff;margin:20px 0;font-weight:700;text-transform:uppercase;letter-spacing:3px;text-align:center;text-shadow:0 0 15px rgba(162,89,255,0.7)}
        p{font-size:1.3em;color:#d0d0d0;max-width:700px;text-align:center;margin:1.5rem 0;text-shadow:0 1px 3px rgba(0,0,0,0.5)}
        pre{
            font-family:'Roboto',sans-serif;font-size:1em;color:#e0e0e0;
            background:rgba(50,50,50,0.5);padding:15px;border-radius:8px;
            max-width:700px;text-align:left;margin:0 auto;white-space:pre-wrap;
        }
        .button-container{margin:3rem 0;display:flex;flex-direction:column;gap:70px;align-items:center}
        button{
            padding:20px 40px;background:linear-gradient(135deg,#1f1f1f 0%,#333 100%);
            border:none;border-radius:10px;color:#fff;font-size:1.4em;font-weight:700;
            text-transform:uppercase;cursor:pointer;transition:all .3s ease;
            width:260px;justify-content:center;box-shadow:0 0 15px rgba(162,89,255,0.3);
        }
        button:hover{transform:scale(1.05);box-shadow:0 0 25px rgba(162,89,255,0.6);background:linear-gradient(135deg,#333 0%,#444 100%)}

        .arrow-button{
            font-size:1em;padding:8px 16px;width:auto;min-width:50px;background:none;
            border:none;color:#a259ff;font-weight:600;cursor:pointer;
        }
        .arrow-button:hover{color:#c084fc;transform:scale(1.1)}

        @media (max-width:768px){
            h1{font-size:3.5em}
            p{font-size:1.1em}
            button{padding:15px 30px;font-size:1.2em;width:200px}
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="wave-container">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <div class="content-wrapper">
        <h1 id="title">zri.info</h1>
        <p>A site for local games, proxies, and other cool things</p>
        
        <div class="button-container">
            <div id="buttonSet1">
                <a href="game.html"><button><span style="margin-right:8px">▶</span> Games</button></a>
                <a href="proxy/indexproxy.html"><button><span style="margin-right:8px">🔌</span> Proxy</button></a>
                <a href="app.html"><button><span style="margin-right:8px">📱</span> App</button></a>
                <a href="readme.html"><button><span style="margin-right:8px">📜</span> README</button></a>
            </div>
            
            <div id="buttonSet2" style="display:none">
                <a href="admin.html"><button><span style="margin-right:8px">🛠️</span> Admin</button></a>
                <a href="slot-machine.html"><button><span style="margin-right:8px">🎰</span> GAMBLING</button></a>
                <a href="road-map.html"><button><span style="margin-right:8px">🗺️</span> Roadmap</button></a>
            </div>
            
            <button class="arrow-button" id="arrowButton">➡️</button>
        </div>

        <p>If you encounter any games that are not functioning, please report them to <a href="mailto:help@zri.info" style="color:#a259ff;text-decoration:underline">help@zri.info</a>.</p>
        <pre>Game: Example Game, Issue: Blocked
Game: Example Game, Issue: 404 Not Found or File Typo in Games Table</pre>
    </div>

    <script>
        // Simple toggle between button sets
        let currentSet = 1;
        const buttonSet1 = document.getElementById("buttonSet1");
        const buttonSet2 = document.getElementById("buttonSet2");
        const arrowButton = document.getElementById("arrowButton");

        arrowButton.addEventListener("click", () => {
            currentSet = currentSet === 1 ? 2 : 1;
            buttonSet1.style.display = currentSet === 1 ? "block" : "none";
            buttonSet2.style.display = currentSet === 2 ? "block" : "none";
            arrowButton.textContent = currentSet === 1 ? "➡️" : "⬅️";
        });

        // Title animation
        const title = document.getElementById("title");
        const text = title.textContent;
        title.innerHTML = "";
        text.split("").forEach((char, i) => {
            const span = document.createElement("span");
            span.style.display = "inline-block";
            span.style.opacity = "0";
            span.style.transform = "translateY(20px)";
            span.style.transition = `all 0.5s ease ${i * 50}ms`;
            span.textContent = char;
            title.appendChild(span);
            
            setTimeout(() => {
                span.style.opacity = "1";
                span.style.transform = "translateY(0)";
            }, 100);
        });

        // Star particles
        const starsContainer = document.querySelector(".stars");
        function createStar() {
            const star = document.createElement("div");
            star.className = "star";
            star.style.left = Math.random() * 100 + "%";
            star.style.top = Math.random() * 100 + "%";
            starsContainer.appendChild(star);
            setTimeout(() => star.remove(), 4000);
        }
        setInterval(createStar, 80);

        // Keyboard support for arrow
        document.addEventListener("keydown", e => {
            if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
                arrowButton.click();
            }
        });
    </script>
</body>
</html>
