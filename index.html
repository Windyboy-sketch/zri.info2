<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zri.info</title>
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Roboto,sans-serif;background:linear-gradient(180deg,#0a0a0a 0%,#1a1a2e 100%);min-height:100vh;color:#fff;display:flex;align-items:center;justify-content:center;overflow-x:hidden;position:relative}
        .stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
        .star{position:absolute;width:6px;height:6px;background:#a259ff;border-radius:50%;box-shadow:0 0 15px #a259ff,0 0 25px rgba(162,89,255,.8);animation:shoot 4s linear infinite,twinkle 1.5s infinite}
        .star::before{content:"";position:absolute;width:40px;height:2px;background:linear-gradient(90deg,transparent,#a259ff);left:-40px;top:50%;transform:translateY(-50%)}
        @keyframes shoot{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-130vw,90vh);opacity:.2}}
        @keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.5}}

        .wave-container{position:fixed;bottom:0;left:0;width:100%;height:120px;overflow:hidden;z-index:-1}
        .wave{position:absolute;bottom:0;width:200%;height:100%;background-repeat:repeat-x;animation:waveMove 15s linear infinite,waveFloat 5s ease-in-out infinite}
        .wave:nth-child(2){animation:waveMove 18s linear infinite reverse,waveFloat 6s ease-in-out infinite;opacity:.6}
        .wave:nth-child(3){animation:waveMove 12s linear infinite,waveFloat 4s ease-in-out infinite;opacity:.4}
        @keyframes waveMove{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
        @keyframes waveFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

        .content-wrapper{max-width:720px;padding:50px 25px;border-radius:20px;background:rgba(26,26,26,.25);backdrop-filter:blur(12px);border:2px solid rgba(162,89,255,.35);box-shadow:0 10px 40px rgba(0,0,0,.5);text-align:center}
        h1{font-size:5.8rem;color:#a259ff;margin:15px 0;text-transform:uppercase;letter-spacing:4px;text-shadow:0 0 20px rgba(162,89,255,.8)}
        p{font-size:1.25rem;color:#ddd;margin:1.5rem 0}
        pre{background:rgba(50,50,50,.6);padding:15px;border-radius:8px;text-align:left;font-size:1rem;margin:20px auto;max-width:100%;white-space:pre-wrap}

        .button-container{margin:30px 0;display:flex;flex-wrap:wrap;gap:15px;justify-content:center}
        button{padding:16px 32px;background:linear-gradient(135deg,#1f1f1f,#333);border:none;border-radius:12px;color:#fff;font-size:1.15rem;font-weight:700;cursor:pointer;transition:.3s;min-width:170px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 15px rgba(162,89,255,.3)}
        button:hover{transform:scale(1.05);box-shadow:0 0 25px rgba(162,89,255,.6);background:linear-gradient(135deg,#333,#444)}
        .arrow-btn{padding:12px 20px;font-size:1.6rem;background:none;border:none;color:#a259ff;cursor:pointer}

        @media(max-width:768px){h1{font-size:3.8rem}.content-wrapper{padding:35px 20px}}
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="wave-container">
        <div class="wave" style="background:url('data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 1440 320%27><path fill=%27rgba(162,89,255,0.8)%27 d=%27M0,128C48,112,96,96,144,96C192,96,240,112,288,128C336,144,384,160,432,160C480,160,528,144,576,128C624,112,672,96,720,96C768,96,816,112,864,128C912,144,960,160,1008,160C1056,160,1104,144,1152,128C1200,112,1248,96,1296,96C1344,96,1392,112,1440,128L1440,320L0,320Z%27/></svg>') repeat-x;background-size:50% 100%;"></div>
        <div class="wave" style="background:url('data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 1440 320%27><path fill=%27rgba(120,50,200,0.7)%27 d=%27M0,160C48,144,96,128,144,128C192,128,240,144,288,160C336,176,384,192,432,192C480,192,528,176,576,160C624,144,672,128,720,128C768,128,816,144,864,160C912,176,960,192,1008,192C1056,192,1104,176,1152,160C1200,144,1248,128,1296,128C1344,128,1392,144,1440,160L1440,320L0,320Z%27/></svg>') repeat-x;background-size:50% 100%;"></div>
        <div class="wave" style="background:url('data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 1440 320%27><path fill=%27rgba(80,30,150,0.6)%27 d=%27M0,192C48,176,96,160,144,160C192,160,240,176,288,192C336,208,384,224,432,224C480,224,528,208,576,192C624,176,672,160,720,160C768,160,816,176,864,192C912,208,960,224,1008,224C1056,224,1104,208,1152,192C1200,176,1248,160,1296,160C1344,160,1392,176,1440,192L1440,320L0,320Z%27/></svg>') repeat-x;background-size:50% 100%;"></div>
    </div>

    <div class="content-wrapper">
        <h1 id="title">zri.info</h1>
        <p>A site for local games, proxies, and other cool things</p>

        <div class="button-container" id="set1">
            <a href="game.html"><button>▶ Games</button></a>
            <a href="proxy/indexproxy.html"><button>🔌 Proxy</button></a>
            <a href="app.html"><button>📱 App</button></a>
            <a href="readme.html"><button>📜 README</button></a>
            <button class="arrow-btn" id="arrow">➡️</button>
        </div>

        <div class="button-container" id="set2" style="display:none">
            <a href="admin.html"><button>🛠️ Admin</button></a>
            <a href="slot-machine.html"><button>🎰 GAMBLING</button></a>
            <a href="road-map.html"><button>🗺️ Roadmap</button></a>
        </div>

        <p>If games are not working, report to <a href="mailto:help@zri.info" style="color:#a259ff">help@zri.info</a></p>
        <pre>Game: Example Game, Issue: Blocked
Game: Example Game, Issue: 404 Not Found</pre>
    </div>

    <script>
        // Letter animation for title
        const title = document.getElementById('title');
        title.innerHTML = title.textContent.split('').map((c,i)=>`<span style="opacity:0;transition:all .6s ${i*60}ms;display:inline-block">${c}</span>`).join('');
        setTimeout(()=>title.querySelectorAll('span').forEach(s=>s.style.opacity=1), 100);

        // Shooting stars
        function createStar(){
            const s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random()*100 + '%';
            s.style.top = Math.random()*70 + '%';
            document.querySelector('.stars').appendChild(s);
            setTimeout(()=>s.remove(), 4500);
        }
        setInterval(createStar, 110);

        // Toggle button sets
        let setNum = 1;
        document.getElementById('arrow').addEventListener('click', ()=>{
            setNum = setNum === 1 ? 2 : 1;
            document.getElementById('set1').style.display = setNum === 1 ? 'flex' : 'none';
            document.getElementById('set2').style.display = setNum === 2 ? 'flex' : 'none';
            document.getElementById('arrow').textContent = setNum === 1 ? '➡️' : '⬅️';
        });
    </script>
</body>
</html>
